# ----------------------------------------------------------------------------
# JVM tuning: daemon was being killed at the 16-minute mark by Windows Defender /
# OneDrive / OOM. Disabling the daemon and lowering the heap makes the build
# survive those interruptions; you trade ~30s of JVM warm-up per build.
# ----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false

# AndroidX / Jetifier
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34

# Opt out of AGP 9's new DSL — required for the Flutter Gradle plugin and many
# community plugins (image_picker_android, file_picker, flutter_secure_storage)
# to keep working. See: https://docs.flutter.dev/release/breaking-changes/migrate-to-agp-9
android.newDsl=false

# R-class settings (faster, smaller)
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.useFallbackStrategy=true
