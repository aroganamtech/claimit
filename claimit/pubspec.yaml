name: claimit_app
description: Claimit - Insurance Claims Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: 9.2.2

  # State management & navigation
  provider: ^6.1.2
  go_router: ^13.2.0

  # UI / forms
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6

  # Pickers — pinned to revisions that build on AGP 8.7 + Kotlin 1.9.24
  # without the "Configuration with name 'implementation' not found" error.
  image_picker: 1.0.7
  file_picker: 8.0.0+1

  # Permissions (runtime camera/storage permission requests)
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
