org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

# ── Two settings needed after the Flutter/Kotlin toolchain upgrade ───────────
# Build settings only. They change nothing about the app's code or behaviour.

# The app module builds at Java 17, but several Flutter plugins still declare
# Java 1.8 for themselves while their Kotlin now compiles at 17. Newer Kotlin
# Gradle Plugin versions treat that mismatch as a hard error:
#
#   Inconsistent JVM-target compatibility detected for tasks
#   'compileReleaseJavaWithJavac' (1.8) and 'compileReleaseKotlin' (17)
#
# This is the same mix that built fine before the upgrade — Android's D8
# desugaring handles it — so the check is relaxed back to a warning rather
# than editing every third-party plugin.
kotlin.jvm.target.validation.mode=warning

# Kotlin's incremental compiler stores cache entries as paths relative to the
# project. The pub cache lives on C: while this project is on F:, and a
# relative path can't cross drives, so the cache write throws:
#
#   this and base files have different roots:
#   C:\...\pub.dev\camera_android_camerax-...\CameraXLibrary.g.kt
#   and F:\my_project_git\claimit\claimitapporg\android
#
# Turning incremental compilation off avoids that cache entirely. Builds are
# a little slower, but they complete.
kotlin.incremental=false
