<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280">
  <rect width="380" height="280" rx="16" fill="#0D1B2A"/>
  <!-- card -->
  <g transform="translate(70 80)">
    <rect x="0" y="0" width="180" height="110" rx="14" fill="#1565C0"/>
    <rect x="14" y="20" width="40" height="28" rx="4" fill="#F5A623"/>
    <rect x="14" y="60" width="120" height="6" rx="2" fill="#fff" opacity=".8"/>
    <rect x="14" y="74" width="80" height="6" rx="2" fill="#fff" opacity=".5"/>
    <text x="166" y="100" font-size="18" text-anchor="end" fill="#fff" font-family="sans-serif" font-weight="700">VISA</text>
  </g>
  <!-- coins -->
  <g>
    <circle cx="290" cy="120" r="22" fill="#F5A623"/>
    <text x="290" y="128" font-size="22" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">₹</text>
    <circle cx="320" cy="160" r="18" fill="#F5A623" opacity=".85"/>
    <text x="320" y="166" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">₹</text>
    <circle cx="270" cy="180" r="14" fill="#F5A623" opacity=".7"/>
  </g>
  <!-- check -->
  <g transform="translate(160 210)">
    <circle cx="0" cy="0" r="22" fill="#4CAF50"/>
    <path d="M-10 0 L-2 8 L12 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
