<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="380" height="280" rx="16" fill="url(#bgB)"/>
  <!-- phone -->
  <rect x="120" y="40" width="140" height="220" rx="22" fill="#1565C0"/>
  <rect x="128" y="50" width="124" height="200" rx="14" fill="#fff"/>
  <!-- otp boxes -->
  <g>
    <rect x="138" y="120" width="22" height="32" rx="4" fill="#1565C0"/>
    <text x="149" y="142" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">1</text>
    <rect x="166" y="120" width="22" height="32" rx="4" fill="#1565C0"/>
    <text x="177" y="142" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">2</text>
    <rect x="194" y="120" width="22" height="32" rx="4" fill="#1565C0"/>
    <text x="205" y="142" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">3</text>
    <rect x="222" y="120" width="22" height="32" rx="4" fill="#E3F2FD" stroke="#1565C0"/>
    <text x="233" y="142" font-size="16" text-anchor="middle" fill="#1565C0" font-family="sans-serif" font-weight="700">4</text>
  </g>
  <text x="190" y="100" font-size="11" text-anchor="middle" fill="#1565C0" font-family="sans-serif" font-weight="600">Enter OTP</text>
  <!-- shield with checkmark -->
  <g transform="translate(48 60)">
    <path d="M0 8 L20 0 L40 8 V28 C40 44 24 52 20 54 C16 52 0 44 0 28 Z" fill="#F5A623"/>
    <path d="M12 28 L18 34 L30 22" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- envelope -->
  <g transform="translate(290 180)">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#1565C0"/>
    <path d="M0 0 L30 22 L60 0" stroke="#fff" stroke-width="2" fill="none"/>
  </g>
</svg>
