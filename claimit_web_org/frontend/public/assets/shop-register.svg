<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="380" height="280" rx="16" fill="url(#bgC)"/>
  <!-- ground -->
  <rect x="0" y="220" width="380" height="60" fill="#A5D6A7" opacity=".4"/>
  <!-- shop -->
  <g transform="translate(110 80)">
    <rect x="0" y="40" width="160" height="120" fill="#fff" stroke="#1565C0" stroke-width="2"/>
    <polygon points="-10,40 80,0 170,40" fill="#1565C0"/>
    <rect x="0" y="40" width="160" height="14" fill="#F5A623"/>
    <rect x="20" y="74" width="40" height="40" fill="#E3F2FD" stroke="#1565C0"/>
    <rect x="100" y="74" width="40" height="40" fill="#E3F2FD" stroke="#1565C0"/>
    <rect x="60" y="100" width="40" height="60" fill="#1565C0"/>
    <circle cx="92" cy="130" r="2" fill="#fff"/>
    <text x="80" y="50" font-size="9" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">SHOP</text>
  </g>
  <!-- pin -->
  <g transform="translate(290 50)">
    <path d="M20 0 C8 0 0 8 0 20 C0 34 20 50 20 50 C20 50 40 34 40 20 C40 8 32 0 20 0 Z" fill="#F5A623"/>
    <circle cx="20" cy="20" r="7" fill="#fff"/>
  </g>
  <!-- coin -->
  <circle cx="60" cy="100" r="18" fill="#F5A623"/>
  <text x="60" y="106" font-size="16" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">₹</text>
</svg>
