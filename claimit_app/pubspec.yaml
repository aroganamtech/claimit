name: claimit_app
description: Claimit - Insurance Claims Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  go_router: ^13.2.0
  flutter_otp_text_field: ^1.1.3
  image_picker: ^1.1.3
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  pin_code_fields: ^8.0.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  file_picker: ^8.0.3
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
