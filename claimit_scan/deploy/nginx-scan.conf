# Add INSIDE the existing server block. Do not create a new server block and
# do not touch the location entries for 8001 or 8002.
#
#   sudo nano /etc/nginx/sites-available/<existing site>
#   sudo nginx -t && sudo systemctl reload nginx     # reload, never restart

location /scan/ {
    proxy_pass http://127.0.0.1:8003/scan/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Azure polling can take a few seconds; the client should not give up first.
    proxy_read_timeout 60s;

    # Only the key travels here, never the image — so this stays small on
    # purpose. A large body to this path is a mistake or an attack.
    client_max_body_size 256k;
}

location = /scan/health {
    proxy_pass http://127.0.0.1:8003/health;
    access_log off;
}
